# ════════════════════════════════════════════════════════════════
# CreatoKite Production Nginx Reverse Proxy Configuration
# Place this file at: /etc/nginx/sites-available/creatokite
# Enable with: sudo ln -s /etc/nginx/sites-available/creatokite /etc/nginx/sites-enabled/
# ════════════════════════════════════════════════════════════════

# ── Node.js Upstream Cluster Load Balancer ──────────────────────
upstream creatokite_backend {
    server 127.0.0.1:5000 max_fails=3 fail_timeout=10s;
    # Add secondary Node.js worker instances if using multi-port clustering:
    # server 127.0.0.1:5001 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

# ── HTTP -> HTTPS Permanent Redirect ────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name creatokite.com www.creatokite.com api.creatokite.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Production HTTPS Server ─────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name creatokite.com www.creatokite.com api.creatokite.com;

    # ── SSL Certificates (Certbot / Let's Encrypt) ──────────────
    ssl_certificate     /etc/letsencrypt/live/creatokite.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/creatokite.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── Security Headers ─────────────────────────────────────────
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # ── Gzip & Brotli Compression ───────────────────────────────
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        application/javascript
        application/json
        application/xml
        text/css
        text/plain
        text/xml
        image/svg+xml;

    # ── Client Request Limits ───────────────────────────────────
    client_max_body_size 15M;
    client_body_buffer_size 128k;

    # ── Vite / React Static Frontend Build Delivery ─────────────
    root /var/www/creatokite/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        expires 1d;
        add_header Cache-Control "public, must-revalidate";
    }

    # Static assets immutable caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Express API Proxy Pass ──────────────────────────────────
    location /api/ {
        proxy_pass http://creatokite_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ── Real-Time Socket.io WebSockets Proxying ─────────────────
    location /socket.io/ {
        proxy_pass http://creatokite_backend;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
